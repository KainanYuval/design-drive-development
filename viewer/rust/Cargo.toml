[package]
name = "ddd-applet-rust"
version = "0.1.0"
edition = "2021"
description = "Design Drive Development — Rust/wry diagram applet"

[[bin]]
name = "ddd-applet-rust"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
http = "1"
mime_guess = "2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.30"
wry = "0.47"
