<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Drive Development</title>
    <link rel="stylesheet" href="./webview.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      #boot {
        align-items: center;
        color: #495057;
        display: flex;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        height: 100%;
        justify-content: center;
        width: 100%;
      }
      #root {
        display: none;
        height: 100%;
        width: 100%;
      }
      #root.ready {
        display: block;
      }
      #boot.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">Loading diagram…</div>
    <div id="root"></div>
    <script defer src="./webview.js"></script>
    <script defer>
      window.addEventListener("DOMContentLoaded", () => {
        const boot = document.getElementById("boot");
        const root = document.getElementById("root");
        const done = () => {
          boot.classList.add("hidden");
          root.classList.add("ready");
        };
        if (window.__DDD_APPLET__) {
          done();
        } else {
          const tick = window.setInterval(() => {
            if (window.__DDD_APPLET__) {
              window.clearInterval(tick);
              done();
            }
          }, 16);
        }
      });
    </script>
  </body>
</html>
